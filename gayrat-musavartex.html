button.cell{font-family:inherit;color:#fff;cursor:pointer;margin:0;-webkit-appearance:none;appearance:none}
.cell{aspect-ratio:1/1;width:100%;height:auto}
.wrap .grid .cell .tile{animation:none;filter:none;transform:none}
.wrap .grid .cell .tile svg{animation:none}
.wrap .grid .cell .tile::after{animation:none;opacity:0}
.wrap .grid .cell .tile{--ring:rgba(42,255,239,.7)}

/* 1 Call UZ: ringing phone (shared with Call KZ) */
.wrap .grid .cell.a1 .tile svg{animation:a-ring 2.6s ease-in-out infinite}
@keyframes a-ring{0%,50%,100%{transform:rotate(0)}6%{transform:rotate(-18deg)}12%{transform:rotate(16deg)}18%{transform:rotate(-14deg)}24%{transform:rotate(12deg)}30%{transform:rotate(-8deg)}36%{transform:rotate(5deg)}42%{transform:rotate(0)}}
/* 2 Call KZ: same ringing phone as Call UZ */
.wrap .grid .cell.a2 .tile svg{animation:a-ring 2.6s ease-in-out infinite}
/* 3 WhatsApp: jumping bubble */
.wrap .grid .cell.a3 .tile{animation:a-jump 2.4s cubic-bezier(.3,0,.4,1) infinite}
@keyframes a-jump{0%,60%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.1,.88)}30%{transform:translateY(-9px) scale(.94,1.08)}50%{transform:translateY(0) scale(1.08,.92)}55%{transform:translateY(0) scale(.98,1.03)}}
/* 4 WeChat: 3D flip */
.wrap .grid .cell.a4 .tile{animation:a-flip 3.6s ease-in-out infinite}
@keyframes a-flip{0%,55%{transform:perspective(260px) rotateY(0)}85%,100%{transform:perspective(260px) rotateY(360deg)}}
/* 5 Telegram: paper plane flies off and returns */
.wrap .grid .cell.a5 .tile svg{animation:a-plane 3s ease-in infinite}
@keyframes a-plane{0%,40%{transform:translate(0,0);opacity:1}62%{transform:translate(30px,-30px);opacity:0}63%{transform:translate(-30px,30px);opacity:0}85%,100%{transform:translate(0,0);opacity:1}}
/* 6 Instagram: colour cycle */
.wrap .grid .cell.a6 .tile{animation:a-hue 5s linear infinite}
@keyframes a-hue{to{filter:hue-rotate(360deg)}}
/* 7 E-mail: letter drops in */
.wrap .grid .cell.a7 .tile svg{animation:a-drop 3.2s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes a-drop{0%{transform:translateY(-140%);opacity:0}18%{transform:translateY(0);opacity:1}28%{transform:translateY(-4px)}36%,92%{transform:translateY(0);opacity:1}100%{transform:translateY(140%);opacity:0}}
/* 8 Web site: spinning globe */
.wrap .grid .cell.a8 .tile svg{animation:a-spin 4.5s ease-in-out infinite}
@keyframes a-spin{0%,15%{transform:rotate(0)}70%,100%{transform:rotate(360deg)}}
/* 9 Location: original pin animation (glow + two ripple rings + hopping pin) */
.wrap .grid .cell.a9 .tile{overflow:visible;animation:a-pinglow 2.4s ease-in-out infinite}
.wrap .grid .cell.a9 .tile::before,.wrap .grid .cell.a9 .tile::after{content:"";display:block;position:absolute;inset:-1px;width:auto;height:auto;transform:none;background:none;box-shadow:none;border:2px solid rgba(42,255,239,.75);border-radius:inherit;opacity:1;pointer-events:none;animation:a-ripple 2.4s ease-out infinite}
.wrap .grid .cell.a9 .tile::after{animation-delay:1.2s}
.wrap .grid .cell.a9 .tile svg{filter:drop-shadow(0 0 4px rgba(42,255,239,.8));animation:a-hop 2.4s ease-in-out infinite}
@keyframes a-ripple{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.6);opacity:0}}
@keyframes a-hop{0%,55%,100%{transform:translateY(0)}20%{transform:translateY(-5px)}35%{transform:translateY(0)}45%{transform:translateY(-2px)}}
@keyframes a-pinglow{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 8px rgba(42,255,239,.35)}50%{box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 16px rgba(42,255,239,.8)}}
/* 10 QR: scanning line */
.wrap .grid .cell.a10 .tile::after{opacity:1;left:0;width:100%;height:3px;top:0;transform:none;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 8px 2px rgba(255,255,255,.9);animation:a-scan 2.2s ease-in-out infinite}
@keyframes a-scan{0%{top:-5%}50%{top:100%}100%{top:-5%}}
/* 11 Save: heartbeat */
.wrap .grid .cell.a11 .tile svg{animation:a-beat 1.8s ease-in-out infinite}
@keyframes a-beat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.28)}20%{transform:scale(1)}30%{transform:scale(1.18)}}
/* 12 Share: swinging nodes + warm glow */
.wrap .grid .cell.a12 .tile{animation:a-glow 2.8s ease-in-out infinite}
.wrap .grid .cell.a12 .tile svg{animation:a-swing 2.8s ease-in-out infinite}
@keyframes a-glow{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 0 rgba(255,80,130,0)}50%{box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 18px rgba(255,80,130,.85)}}
@keyframes a-swing{0%,100%{transform:rotate(-22deg) scale(1)}50%{transform:rotate(22deg) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.wrap .grid .cell.a9 .tile::before,.wrap .grid .cell.a9 .tile::after{display:none!important}.wrap .grid .cell .tile,.wrap .grid .cell .tile svg,.wrap .grid .cell .tile::after{animation:none!important}}
/* raise tabs slightly */
.wrap .grid{margin-bottom:clamp(18px,3.4vh,34px)}
/* photo animation */
.wrap .hero img{animation:photo-in .8s cubic-bezier(.2,.9,.3,1.2) both,photo-float 4.2s ease-in-out .8s infinite,photo-glow 3s ease-in-out infinite}
@keyframes photo-in{from{opacity:0;transform:scale(.75) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes photo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes photo-glow{0%,100%{box-shadow:0 0 14px rgba(42,255,239,.35);border-color:#3fd6d8}50%{box-shadow:0 0 14px rgba(42,255,239,.6),0 0 30px rgba(42,255,239,.55);border-color:#9ffff6}}
@media (prefers-reduced-motion:reduce){.wrap .hero img{animation:none}}
/* name animation */
.wrap .hero h1{background:linear-gradient(100deg,#fff 40%,#7dfff4 50%,#fff 60%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:name-in .8s ease-out .15s both,name-shine 4.5s linear 1.2s infinite}
@keyframes name-in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes name-shine{0%{background-position:100% 0}55%,100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.wrap .hero h1{animation:none;background:none;-webkit-text-fill-color:#fff;color:#fff}}
/* tabs raised: sit right under the header */
.wrap .hero{flex:none;margin-bottom:clamp(6px,1.2vh,12px)}
.wrap .grid{margin-bottom:0}
/* center header + tabs vertically */
.wrap{justify-content:center}
.wrap .hero{margin-bottom:clamp(10px,2vh,20px)}
/* header at top, tabs centered in remaining space */
.wrap{justify-content:flex-start}
.wrap .hero{margin-bottom:0}
.wrap .grid{margin-top:auto;margin-bottom:auto}
/* header slightly lower */
.wrap .hero{margin-top:clamp(12px,3vh,28px)}
/* wider gap between tabs */
.wrap{--g:clamp(12px,2vh,18px)}
/* tabs nudged up */
.wrap .grid{position:relative;top:calc(-1*clamp(8px,2vh,18px))}
/* photo + name a bit lower */
.wrap .hero{margin-top:clamp(22px,5vh,46px)}
/* photo + name a bit lower again */
.wrap .hero{margin-top:clamp(34px,7.5vh,68px)}
/* photo a bit larger */
.wrap .hero img{width:clamp(124px,calc(var(--u)*22),196px);height:clamp(124px,calc(var(--u)*22),196px);border-radius:clamp(28px,calc(var(--u)*4.8),44px)}
/* v3: smaller photo, one-line name, animated role, tabs higher */
.wrap .hero img{width:clamp(108px,calc(var(--u)*19),172px);height:clamp(108px,calc(var(--u)*19),172px);border-radius:clamp(26px,calc(var(--u)*4.2),38px)}
.wrap .hero h1{white-space:nowrap;font-size:clamp(18px,5.3vw,27px)}
.wrap .hero .role{display:inline-block;background:linear-gradient(100deg,#d5e2e5 40%,#2affef 50%,#d5e2e5 60%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:role-in .9s cubic-bezier(.2,.9,.3,1) .45s both,role-shine 4s linear 1.6s infinite,role-glow 3s ease-in-out 1.6s infinite}
@keyframes role-in{from{opacity:0;transform:translateY(10px);clip-path:inset(0 100% 0 0);letter-spacing:.12em}to{opacity:1;transform:none;clip-path:inset(0 0 0 0);letter-spacing:0}}
@keyframes role-shine{0%{background-position:100% 0}60%,100%{background-position:0 0}}
@keyframes role-glow{0%,100%{filter:drop-shadow(0 0 0 rgba(42,255,239,0))}50%{filter:drop-shadow(0 0 6px rgba(42,255,239,.55))}}
@media (prefers-reduced-motion:reduce){.wrap .hero .role{animation:none;background:none;-webkit-text-fill-color:#d5e2e5;color:#d5e2e5}}
.wrap .grid{top:calc(-1*clamp(20px,4.6vh,40px))}

/* Responsive identity text; the source card's design and animations are retained. */
.who{flex:1;min-width:0}
.wrap .hero h1{max-width:100%}
.wrap .hero .role{max-width:100%;white-space:nowrap}
.wrap .hero .co{max-width:100%;white-space:nowrap}
@media(max-width:380px){
 .wrap .hero img{width:clamp(104px,32vw,122px);height:clamp(104px,32vw,122px)}
 .wrap .hero{gap:12px}
}
/* A high-contrast contact QR with a full quiet zone. */
#qr{background:#fff;padding:0;max-width:100%;line-height:0}
#qr svg{display:block;width:264px;height:auto;max-width:100%;filter:none}
#qr svg>rect:first-child{fill:#fff}
#qr svg path,#qr svg rect:not(:first-child){fill:#071318;stroke:none}
#qr svg{filter:none}
#qd{padding-top:32px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:#102b32;color:#fff;font:600 14px/1.4 Manrope,system-ui,sans-serif;box-shadow:0 8px 28px #0008;z-index:100;text-align:center}
#toast[hidden]{display:none}

/* Displayed only if the browser cannot open its native share sheet. */
#share-help{width:min(92vw,400px);padding:26px 22px 22px;text-align:left;max-height:85vh;overflow:auto}
#share-help h2{padding-right:24px;font-size:21px;line-height:1.3}
#share-help .hint{line-height:1.55;margin-top:14px}
#share-url-controls{margin-top:18px}
#share-help [hidden]{display:none!important}
#share-url-label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
#share-url{width:100%;border:1px solid var(--line);border-radius:12px;background:#071318;color:#fff;padding:12px;font:inherit;font-size:13px}
.share-help-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.share-help-actions button,.share-help-actions a{flex:1;min-width:130px;border:1px solid var(--line);border-radius:12px;background:#12353d;color:#fff;padding:12px 10px;font:600 13px/1.4 Manrope,system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
#share-copy{background:#087f82;border-color:#32d3cb}
